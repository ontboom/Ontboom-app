name: Build Ontboom Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: |
          rm -rf www
          mkdir -p www
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.svg' -o -name '*.ico' \) -exec cp {} www/ \;
          sed -i 's#</head>#<link rel="stylesheet" href="jobs.css"></head>#' www/index.html
          printf '\n<script src="jobs.js"></script>\n<script src="native-share.js"></script>\n<script src="native-contacts.js"></script>\n' >> www/index.html
          test -s www/item-totals.js
          grep -Eq 'setInterval\(update,[[:space:]]*[0-9]+\)' www/item-totals.js
          grep -q 'item-totals.js' www/index.html

      - name: Create clean Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add native Android contact picker
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_CONTACTS" />\n    <application#' "$MANIFEST"
          cat > android/app/src/main/java/za/co/ontboom/app/MainActivity.java <<'JAVA'
          package za.co.ontboom.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.ContactsContract;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            private static final int PICK_CONTACT = 4201;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              bridge.getWebView().addJavascriptInterface(new ContactBridge(), "OntboomAndroid");
            }

            public class ContactBridge {
              @JavascriptInterface
              public void pickContact() {
                runOnUiThread(() -> {
                  Intent i = new Intent(Intent.ACTION_PICK, ContactsContract.CommonDataKinds.Phone.CONTENT_URI);
                  startActivityForResult(i, PICK_CONTACT);
                });
              }
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode != PICK_CONTACT || resultCode != Activity.RESULT_OK || data == null) return;
              Uri uri = data.getData();
              String name = "", phone = "";
              Cursor c = getContentResolver().query(uri,
                new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER},
                null, null, null);
              if (c != null) {
                if (c.moveToFirst()) {
                  name = c.getString(0) == null ? "" : c.getString(0);
                  phone = c.getString(1) == null ? "" : c.getString(1);
                }
                c.close();
              }
              try {
                String js = "window.ontboomContactPicked(" + JSONObject.quote(name) + "," + JSONObject.quote(phone) + ")";
                bridge.getWebView().post(() -> bridge.getWebView().evaluateJavascript(js, null));
              } catch (Exception ignored) {}
            }
          }
          JAVA

      - name: Set Android version
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode 20/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "2.0"/' android/app/build.gradle

      - name: Verify packaged web files
        run: |
          test -s android/app/src/main/assets/public/item-totals.js
          grep -Eq 'setInterval\(update,[[:space:]]*[0-9]+\)' android/app/src/main/assets/public/item-totals.js
          grep -q 'item-totals.js' android/app/src/main/assets/public/index.html

      - name: Build fresh debug APK
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ontboom-v2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ontboom-Android-v2.0
          path: Ontboom-v2.0.apk
          retention-days: 30
