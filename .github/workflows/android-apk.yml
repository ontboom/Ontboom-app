name: Build Ontboom Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: |
          rm -rf www
          mkdir -p www
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.svg' -o -name '*.ico' \) -exec cp {} www/ \;
          sed -i 's#</head>#<link rel="stylesheet" href="jobs.css"></head>#' www/index.html
          printf '\n<script src="jobs.js"></script>\n<script src="native-share.js"></script>\n<script src="native-contacts.js"></script>\n' >> www/index.html

      - name: Create clean Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Set Android version
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode 16/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.6"/' android/app/build.gradle

      - name: Build fresh debug APK
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ontboom-v1.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ontboom-Android-v1.6
          path: Ontboom-v1.6.apk
          retention-days: 30
